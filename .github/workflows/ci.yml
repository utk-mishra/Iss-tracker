name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Required permissions for security scanning
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  backend-tests:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: mvn -B -q verify

  frontend-tests:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run

  docker-build:
    name: Docker build and scan
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build image
        run: docker build -t iss-tracker:latest .
      
      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'iss-tracker:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Run container smoke test
        run: |
          docker run -d --name iss-tracker-test -p 8080:8080 iss-tracker:latest
          sleep 20
          curl -f http://localhost:8080/actuator/health || exit 1
          curl -f http://localhost:8080/api/v1/iss/overview?lat=0\&lon=0\&offline=true || exit 1
          docker stop iss-tracker-test
          docker rm iss-tracker-test
